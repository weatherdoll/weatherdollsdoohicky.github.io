<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>audio gif/png</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Top-Left Exit Button */
        .exit-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            text-decoration: underline;
            font-size: 1rem;
            cursor: pointer;
            z-index: 10;
        }

        /* Bottom-Right Origin Link */
        .origin-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ffffff;
            text-decoration: underline;
            font-size: 0.9rem;
            cursor: pointer;
            z-index: 10;
        }

        .stage-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
            user-select: none;
        }

        .asset-link {
            display: inline-block;
            line-height: 0;
            cursor: pointer;
        }

        .centered-asset {
            width: 200px;
            max-width: 60vw;
            height: auto;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .nav-link {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-link svg {
            width: 30px;
            height: 30px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Exit Button (Top-Left) -->
    <a href="https://weatherdoll.github.io/weatherdollsdoohicky.github.io/" class="exit-btn">Exit</a>

    <div class="stage-container">
        <!-- Left Arrow Link -->
        <a href="#" id="prev-btn" class="nav-link" aria-label="Previous">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </a>

        <!-- Centered PNG/GIF Link -->
        <a href="#" id="asset-link" class="asset-link">
            <img id="interactive-asset" src="" alt="Centered Asset" class="centered-asset">
        </a>

        <!-- Right Arrow Link -->
        <a href="#" id="next-btn" class="nav-link" aria-label="Next">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </a>
    </div>

    <!-- Origin Link (Bottom-Right) -->
    <a href="#" id="audio-origin-link" class="origin-link" target="_blank">Audio Origin</a>

    <!-- AUDIO SYSTEM -->
    <audio id="single-track" preload="auto" crossorigin="anonymous"></audio>

    <script>
        const playlist = [
            {
                image: "output-onlinepngtools.png",
                audio: "GoldenChild.mp3",
                origin: "#" // Replace with actual link later
            },
            {
                image: "kitchen-piano.png", 
                audio: [
                    "Kris_piano_prophecy_music.ogg",
                    "Kris_piano_last_prophecy_music.ogg",
                    "Kris_piano_shop_music.ogg",
                    "Kris_piano_waitingroom_music.ogg",
                    "Kris_piano_rouxls_music.ogg",
                    "Kris_piano_lancer_waltz_music.ogg",
                    "Kris_piano_quiz_music.ogg",
                    "Kris_piano_sevenfour_music.ogg"
                ],
                origin: "#" // Replace with actual link later
            },
            {
                image: "third-image.gif",  
                audio: "another-song.mp3",
                origin: "#" // Replace with actual link later
            }
        ];

        let currentIndex = 0;
        let audioPipelineActive = false;

        const songTrack = document.getElementById('single-track');
        const assetLink = document.getElementById('asset-link');
        const assetButton = document.getElementById('interactive-asset');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const audioOriginLink = document.getElementById('audio-origin-link');

        function getAudioSource(audioData) {
            if (Array.isArray(audioData)) {
                const randomIndex = Math.floor(Math.random() * audioData.length);
                return audioData[randomIndex];
            }
            return audioData;
        }

        function unlockAudioContext() {
            if (!audioPipelineActive) {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioContext();
                    const source = audioCtx.createMediaElementSource(songTrack);
                    source.connect(audioCtx.destination);
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                } catch(err) {
                    console.log("AudioContext active.");
                }
                audioPipelineActive = true;
            }
        }

        function loadItem(index) {
            currentIndex = (index + playlist.length) % playlist.length;
            const currentItem = playlist[currentIndex];

            assetButton.src = currentItem.image;

            const selectedAudio = getAudioSource(currentItem.audio);
            songTrack.src = selectedAudio;
            songTrack.currentTime = 0;

            // Update the bottom-right origin link for the current item
            audioOriginLink.href = currentItem.origin;
        }

        assetLink.addEventListener('click', (e) => {
            e.preventDefault();
            unlockAudioContext();
            songTrack.currentTime = 0;
            songTrack.play().catch(err => console.log("Audio play blocked:", err));
        });

        prevBtn.addEventListener('click', (e) => {
            e.preventDefault();
            loadItem(currentIndex - 1);
        });

        nextBtn.addEventListener('click', (e) => {
            e.preventDefault();
            loadItem(currentIndex + 1);
        });

        loadItem(0);
    </script>

</body>
</html>
