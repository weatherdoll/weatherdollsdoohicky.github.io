<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>placeholder</title>
    <style>
        /* Creates a perfectly centered pitch-black canvas void */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Smaller sizing configuration for your dead-center single PNG */
        .centered-asset {
            width: 85px; /* Forces the image to be smaller on all screens */
            max-width: 50vw; /* Keeps it responsive on smaller mobile layouts */
            height: auto;
            object-fit: contain;
            cursor: pointer;
            image-rendering: pixelated; /* Keeps crisp pixel art borders if it's a sprite */
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <!-- 1. YOUR CENTERED TARGET PNG -->
    <img id="interactive-asset" src="./output-onlinepngtools.png" alt="Centered Asset" class="centered-asset">

    <!-- 2. NO-LOOP AUDIO SYSTEM WITH YOUR EXACT SONG FILENAME -->
    <audio id="single-track" src="./GoldenChild.mp3" preload="auto" crossorigin="anonymous"></audio>

    <script>
        const songTrack = document.getElementById('single-track');
        const assetButton = document.getElementById('interactive-asset');
        
        let audioPipelineActive = false;

        function playSingleTrack(e) {
            e.preventDefault();

            // Web Audio API Pipeline Unlocking Layer (Ensures mobile compliance)
            if (!audioPipelineActive) {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioContext();
                    
                    const source = audioCtx.createMediaElementSource(songTrack);
                    source.connect(audioCtx.destination);
                    
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                } catch(err) {
                    console.log("AudioContext stream active.");
                }
                
                audioPipelineActive = true;
            }

            // Play the track seamlessly from the beginning
            songTrack.currentTime = 0;
            songTrack.play().catch(err => console.log("Audio play blocked:", err));
        }

        // Binds clean click and mobile touch layouts directly to the central image
        assetButton.addEventListener('click', playSingleTrack, { passive: false });
        assetButton.addEventListener('touchstart', playSingleTrack, { passive: false });
    </script>

</body>
</html>
