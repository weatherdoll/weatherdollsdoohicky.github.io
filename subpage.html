<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Media Switcher</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        .stage-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            user-select: none;
        }

        .centered-asset {
            width: 150px;
            max-width: 50vw;
            height: auto;
            object-fit: contain;
            cursor: pointer;
            image-rendering: pixelated;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        .nav-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <div class="stage-container">
        <!-- Left Arrow Circle -->
        <button id="prev-btn" class="nav-btn" aria-label="Previous">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>

        <!-- Centered Interactive PNG/GIF (Clicking this plays the sound) -->
        <img id="interactive-asset" src="" alt="Centered Asset" class="centered-asset">

        <!-- Right Arrow Circle -->
        <button id="next-btn" class="nav-btn" aria-label="Next">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
    </div>

    <!-- AUDIO SYSTEM -->
    <audio id="single-track" preload="auto" crossorigin="anonymous"></audio>

    <script>
        const playlist = [
            {
                image: "output-onlinepngtools.png",
                audio: "GoldenChild.mp3"
            },
            {
                image: "kitchen-piano.png", 
                audio: [
                    "Kris_piano_prophecy_music.ogg",
                    "Kris_piano_last_prophecy_music.ogg",
                    "Kris_piano_shop_music.ogg",
                    "Kris_piano_waitingroom_music.ogg",
                    "Kris_piano_rouxls_music.ogg",
                    "Kris_piano_lancer_waltz_music.ogg",
                    "Kris_piano_quiz_music.ogg",
                    "Kris_piano_sevenfour_music.ogg"
                ]
            },
            {
                image: "third-image.gif",  
                audio: "another-song.mp3"
            }
        ];

        let currentIndex = 0;
        let audioPipelineActive = false;

        const songTrack = document.getElementById('single-track');
        const assetButton = document.getElementById('interactive-asset');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function getAudioSource(audioData) {
            if (Array.isArray(audioData)) {
                const randomIndex = Math.floor(Math.random() * audioData.length);
                return audioData[randomIndex];
            }
            return audioData;
        }

        function unlockAudioContext() {
            if (!audioPipelineActive) {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioContext();
                    const source = audioCtx.createMediaElementSource(songTrack);
                    source.connect(audioCtx.destination);
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                } catch(err) {
                    console.log("AudioContext active.");
                }
                audioPipelineActive = true;
            }
        }

        // Just changes the image and audio source WITHOUT playing automatically
        function loadItem(index) {
            currentIndex = (index + playlist.length) % playlist.length;
            const currentItem = playlist[currentIndex];

            assetButton.src = currentItem.image;

            // If it's a random pool, pick a track when switching; otherwise use the track
            const selectedAudio = getAudioSource(currentItem.audio);
            songTrack.src = selectedAudio;
            songTrack.currentTime = 0;
        }

        // Clicking the center image plays/restarts the sound
        function playCurrentTrack(e) {
            if (e) e.preventDefault();
            unlockAudioContext();
            songTrack.currentTime = 0;
            songTrack.play().catch(err => console.log("Audio play blocked:", err));
        }

        assetButton.addEventListener('click', playCurrentTrack);
        assetButton.addEventListener('touchstart', playCurrentTrack, { passive: false });

        // Arrows ONLY switch images/audio sources without auto-playing
        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            loadItem(currentIndex - 1);
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            loadItem(currentIndex + 1);
        });

        // Initialize first item on page load
        loadItem(0);
    </script>

</body>
</html>
