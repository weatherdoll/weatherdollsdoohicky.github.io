<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weatherdoll-doohicky</title>
    <style>
        /* Establishes the clean, pitch-black retro void */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Top header bar: Pins GIFs to the far edges and centers the text */
        .top-header {
            display: flex;
            justify-content: space-between; /* Pushes the two GIFs to opposite sides */
            align-items: center;
            padding: 20px;
        }

        /* Responsive sizing configuration for your corner GIFs */
        .corner-gif {
            width: 100px; /* Perfect size for retro sprite proportions */
            height: auto;
            image-rendering: pixelated;
            cursor: pointer;
        }

        /* Central header block positioning */
        .title-center {
            text-align: center;
            flex-grow: 1;
        }

        .title-center h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
            font-weight: normal;
        }

        .title-center p {
            font-size: 16px;
            color: #aaaaaa;
            margin: 0;
        }

        /* Links block containment layout */
        .links-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 40px;
        }

        /* Bullet point layout styling */
        .links-list {
            list-style-type: disc;
            padding-left: 20px;
            font-size: 18px;
            line-height: 2;
        }

        /* Custom signature light-blue styling directly from your sketch */
        .links-list a {
            color: #38b6ff; 
            text-decoration: none;
            cursor: pointer;
        }

        .links-list a:hover {
            text-decoration: underline; /* Standard subtle hover effect */
        }
    </style>
</head>
<body>

    <!-- TOP HEADER: TWO CORNER GIFS AND HEADER STRINGS -->
    <header class="top-header">
        <!-- Left Side GIF Element (Kris) -->
        <img src="kris.gif" alt="Kris GIF" class="corner-gif" id="gif-left">

        <!-- Core Landing Titles -->
        <div class="title-center">
            <h1>Variable's Doohickey stuff</h1>
            <p>random stuff I made for no reason</p>
        </div>

        <!-- Right Side GIF Element (Ralsei) -->
        <img src="ralsei.gif" alt="Ralsei GIF" class="corner-gif" id="gif-right">
    </header>

    <!-- MAIN LINKS COLLECTION BLOCK -->
    <main class="links-container">
        <ul class="links-list">
            <!-- Replace 'secret-room.html' with the actual page you want to open -->
            <li><a href="subpage.html">subpage 1</a></li>
            <li><a href="#">placeholder</a></li>
        </ul>
    </main>

    <!-- COMPATIBLE AUDIO SYSTEM GRAPH ENGINES -->
    <audio id="bg-music" src="music4.ogg" loop preload="auto" crossorigin="anonymous"></audio>
    <audio id="sfx-left" src="snd_pirouette.mp3" preload="auto" crossorigin="anonymous"></audio>
    <audio id="sfx-right1" src="Snd_ralseising1_music.wav" preload="auto" crossorigin="anonymous"></audio>
    <audio id="sfx-right2" src="Snd_ralseising2_music.wav" preload="auto" crossorigin="anonymous"></audio>

    <script>
        const musicTrack = document.getElementById('bg-music');
        const sfxLeft = document.getElementById('sfx-left');
        const sfxRight1 = document.getElementById('sfx-right1');
        const sfxRight2 = document.getElementById('sfx-right2');
        
        let audioCtxInitialized = false;
        let rightClickCount = 0; // Tracks clicks to cycle between ralseising1 and ralseising2

        // Force-unlocks full audio priority pipeline on desktop and mobile browsers
        function initAudioPipeline() {
            if (!audioCtxInitialized) {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioContext();
                    
                    // Route music and all SFX through the exact same system context graph
                    const musicSource = audioCtx.createMediaElementSource(musicTrack);
                    musicSource.connect(audioCtx.destination);
                    
                    const leftSource = audioCtx.createMediaElementSource(sfxLeft);
                    leftSource.connect(audioCtx.destination);
                    
                    const right1Source = audioCtx.createMediaElementSource(sfxRight1);
                    right1Source.connect(audioCtx.destination);
                    
                    const right2Source = audioCtx.createMediaElementSource(sfxRight2);
                    right2Source.connect(audioCtx.destination);
                    
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                } catch(err) {
                    console.log("AudioContext pipeline running.");
                }
                
                musicTrack.play().catch(e => console.log("Awaiting link interaction for background audio."));
                audioCtxInitialized = true;
            }
        }

        // Left GIF Interaction Handler (Kris)
        document.getElementById('gif-left').addEventListener('click', () => {
            initAudioPipeline();
            sfxLeft.currentTime = 0;
            sfxLeft.play().catch(err => console.log(err));
        });

        // Right GIF Interaction Handler (Ralsei) - Cycles through ralseising1 and ralseising2 in order
        document.getElementById('gif-right').addEventListener('click', () => {
            initAudioPipeline();
            
            if (rightClickCount % 2 === 0) {
                sfxRight1.currentTime = 0;
                sfxRight1.play().catch(err => console.log(err));
            } else {
                sfxRight2.currentTime = 0;
                sfxRight2.play().catch(err => console.log(err));
            }
            
            rightClickCount++; // Advance count to toggle sound on next click
        });
    </script>

</body>
</html>
